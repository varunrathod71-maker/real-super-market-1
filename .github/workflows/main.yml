name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Find the project (unzips it if you uploaded the zip)
        id: find
        shell: bash
        run: |
          shopt -s nullglob
          for z in *.zip; do
            echo "Unzipping $z"
            unzip -oq "$z" -d unzipped_project
          done
          S=$(find . -name settings.gradle.kts -not -path './.git/*' | head -n 1)
          if [ -z "$S" ]; then
            echo "Files in the repo:"; ls -la
            echo "::error title=Project files are missing::settings.gradle.kts was not found. Upload RealSupermarket.zip to the main page of this repo, then run again."
            exit 1
          fi
          echo "Project folder: $(dirname "$S")"
          echo "dir=$(dirname "$S")" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Install Gradle 8.7 and Android SDK 34
        shell: bash
        run: |
          wget -q -O "$RUNNER_TEMP/gradle.zip" https://services.gradle.org/distributions/gradle-8.7-bin.zip
          unzip -q "$RUNNER_TEMP/gradle.zip" -d "$HOME"
          echo "$HOME/gradle-8.7/bin" >> "$GITHUB_PATH"
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-34" "build-tools;34.0.0" > /dev/null || true

      - name: Build the APK
        shell: bash
        working-directory: ${{ steps.find.outputs.dir }}
        run: |
          set -o pipefail
          gradle :app:assembleDebug --no-daemon --console=plain --stacktrace 2>&1 | tee "$GITHUB_WORKSPACE/build.log"

      - name: Show the real errors
        if: failure()
        shell: bash
        run: |
          [ -f build.log ] || exit 0
          grep -E "^e: |^error: |error: |Unresolved reference|What went wrong|Execution failed|Could not |FAILURE" build.log | sed -E 's#file:///[^ ]*/(app/src/[^ ]*)#\1#' | head -n 40 > errors.txt || true
          { echo "### Build failed - send this to Claude"; echo '```'; cat errors.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          head -n 10 errors.txt | while IFS= read -r line; do echo "::error::${line:0:300}"; done
          echo "----- last 60 log lines -----"; tail -n 60 build.log

      - name: Keep a copy on the run page
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: RealSupermarket-apk
          path: ${{ steps.find.outputs.dir }}/app/build/outputs/apk/debug/app-debug.apk

      - name: Publish the APK on the Releases page
        if: success()
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cp "${{ steps.find.outputs.dir }}/app/build/outputs/apk/debug/app-debug.apk" RealSupermarket.apk
          gh release delete latest-apk --cleanup-tag --yes || true
          gh release create latest-apk RealSupermarket.apk --title "Real Supermarket APK" --notes "Built automatically. Download RealSupermarket.apk and install it." --target "${{ github.sha }}"
